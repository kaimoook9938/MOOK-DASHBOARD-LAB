<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOOK Dashboard Lab</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>🧪 MOOK Dashboard Lab</h1>
            <p>Employee Management Dashboard</p>
        </div>

        <div id="todayDate"></div>
    </header>

    <main class="container">

        <!-- KPI -->
        <section class="cards">

            <div class="card">
                <p>Total Employees</p>
                <h2 id="totalEmployees">0</h2>
            </div>

            <div class="card">
                <p>Departments</p>
                <h2 id="totalDepartments">0</h2>
            </div>

            <div class="card">
                <p>Developers</p>
                <h2 id="totalDevelopers">0</h2>
            </div>

        </section>

        <!-- Add Employee -->
        <section class="form-section">
            <h2>➕ Add Employee</h2>

            <input id="empName" placeholder="Name">

            <input id="empPosition" placeholder="Position">

            <select id="empDepartment">
                <option value="">Select Department</option>
                <option>IT</option>
                <option>HR</option>
                <option>Finance</option>
                <option>Marketing</option>
            </select>

            <button id="addBtn" onclick="addEmployee()">Add Employee</button>        </section>

        <!-- Employee Table -->
        <section class="table-section">

            <h2>📋 Employee List</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Department</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">

                </tbody>

            </table>

        </section>

    </main>

<script src="script.js"></script>

</body>
</html>
